name: Fork maintenance

# The only workflow this fork runs. Upstream's 57 are deleted in the
# maintenance delta on every rebuild.
#
# Daily (and on demand):
#   1. REBUILD main as upstream/main + delta (never rebase the delta)
#   2. rebase every patch/* branch onto the rebuilt main
#   3. rebuild integration = main + all clean patches
#   4. run the CI gate on that integration commit — and only there
#
# Scheduled workflows are disabled by default when a public repo is forked;
# this one is enabled in the Actions tab. Re-enable with `gh workflow enable`.
#
# NOTE: a push made with GITHUB_TOKEN does not trigger other workflows. That is
# deliberate: the sync can never cascade into a run of itself, and CI runs in
# this same run against the sha it just built.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print planned git operations without pushing"
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Sync upstream, rebase patches, build integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      integration_sha: ${{ steps.sync.outputs.integration_sha }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      patches_failed: ${{ steps.sync.outputs.patches_failed }}
      integration_changed: ${{ steps.sync.outputs.integration_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - name: Load maintenance branch
        run: |
          set -euo pipefail
          git fetch --filter=blob:none origin '+refs/heads/maintenance:refs/remotes/origin/maintenance'
          rm -rf /tmp/maintenance
          git worktree add --detach /tmp/maintenance origin/maintenance

      - name: Install commit signing key
        # Without this every commit this job creates (delta rebuild, patch
        # replays, integration merges) is unsigned, and each daily rebuild
        # force-pushes those unsigned commits over the refs.
        # The key is a dedicated CI key registered as an SSH *signing* key on
        # RacciDev-Bot; it is not the container's personal key.
        env:
          COMMIT_SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${COMMIT_SIGNING_KEY:-}" ]; then
            echo "::warning::COMMIT_SIGNING_KEY is not set — commits from this run will be unsigned"
            exit 0
          fi
          key="$RUNNER_TEMP/commit_signing"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$COMMIT_SIGNING_KEY" > "$key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$key"
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          echo "commit signing enabled (ssh, key in RUNNER_TEMP)"

      - name: Sync
        id: sync
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          MAINT_DIR: /tmp/maintenance
        run: |
          set -euo pipefail
          out=$(bash /tmp/maintenance/bin/sync.sh | tee /dev/stderr)
          echo "integration_sha=$(printf '%s\n' "$out" | sed -n 's/^INTEGRATION_SHA=//p' | tail -1)" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(printf '%s\n' "$out" | sed -n 's/^UPSTREAM_SHA=//p' | tail -1)" >> "$GITHUB_OUTPUT"
          echo "patches_failed=$(printf '%s\n' "$out" | sed -n 's/^PATCHES_FAILED=//p' | tail -1)" >> "$GITHUB_OUTPUT"
          echo "integration_changed=$(printf '%s\n' "$out" | sed -n 's/^INTEGRATION_CHANGED=//p' | tail -1)" >> "$GITHUB_OUTPUT"

  ci:
    name: CI gate on integration
    needs: maintain
    # a dry run never pushes its integration sha, so there is nothing to check out
    if: always() && inputs.dry_run != true && needs.maintain.outputs.integration_sha != '' && needs.maintain.outputs.integration_changed == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.maintain.outputs.integration_sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra all --group dev --group test

      - name: Load patch manifest
        run: |
          set -euo pipefail
          git fetch --filter=blob:none origin '+refs/heads/maintenance:refs/remotes/origin/maintenance'
          git worktree add --detach /tmp/maintenance origin/maintenance

      - name: Tier 0 — blocking lint, types and code-health ratchet
        run: .venv/bin/python scripts/check

      - name: Tier 1 — tests for the patched areas
        run: |
          set -euo pipefail
          mapfile -t files < <(jq -r '.patches[] | select(.status=="active") | .tests[]' /tmp/maintenance/manifest.json)
          printf 'targeted tests: %s\n' "${files[*]}"
          HERMES_PYTHON="$PWD/.venv/bin/python" bash scripts/run_tests.sh "${files[@]}"


  # The patchset's only test. The pivot python gate above cannot see nix files,
  # so without this the flake changes ship on the strength of a local eval.
  # Runs only when the integration actually differs from upstream in nix terms.
  nix:
    name: Nix gate on integration
    needs: maintain
    if: always() && inputs.dry_run != true && needs.maintain.outputs.integration_sha != '' && needs.maintain.outputs.integration_changed == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.maintain.outputs.integration_sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Does the patchset touch nix?
        id: scope
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "${{ needs.maintain.outputs.upstream_sha }}"..HEAD -- flake.nix flake.lock nix/ || true)
          if [ -n "$changed" ]; then
            printf 'run=1\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' "$changed"
          else
            printf 'run=0\n' >> "$GITHUB_OUTPUT"
            echo "no nix changes in this integration"
          fi

      # allow-import-from-derivation=false is the design driver of the builder:
      # an IFD-dependent flake must fail here, not on a user's machine.
      - name: Install nix
        if: steps.scope.outputs.run == '1'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = false

      - name: Version is derived, not 0.0.0
        if: steps.scope.outputs.run == '1'
        run: |
          set -euo pipefail
          for a in default minimal messaging; do
            v=$(nix eval --raw ".#packages.x86_64-linux.$a.version")
            echo "$a = $v"
            [ "$v" != "0.0.0" ] || { echo "::error::$a still ships 0.0.0"; exit 1; }
          done

      - name: Every package instantiates
        if: steps.scope.outputs.run == '1'
        run: |
          set -euo pipefail
          for a in default minimal messaging desktop tui web webapp sandbox; do
            nix eval --raw ".#packages.x86_64-linux.$a.drvPath" > /dev/null
            echo "ok  $a"
          done

      - name: Overlay and builder contract
        if: steps.scope.outputs.run == '1'
        run: |
          set -euo pipefail
          nix eval --impure --raw --expr '
            let
              f = builtins.getFlake (toString ./.);
              mk = system: overlays: import f.inputs.nixpkgs { inherit system overlays; };
              with_ = mk "x86_64-linux" [ f.overlays.default ];
              locked = mk "x86_64-linux" [ f.overlays.locked ];
              drv = p: builtins.unsafeDiscardStringContext p.drvPath;
              shipped = f.packages.x86_64-linux.default;
            in
              if drv with_.hermes-agent != drv shipped
              then throw "overlays.default drifted from packages.default"
              else if drv locked.hermes-agent != drv shipped
              then throw "overlays.locked drifted from packages.default"
              else "${with_.hermes-agent.version}|${with_.hermes-agent.python.pkgs.python.version}"
          '

  verdict:
    name: Integration verdict
    needs: [maintain, ci, nix]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when the integration is incomplete
        run: |
          set -euo pipefail
          failed="${{ needs.maintain.outputs.patches_failed }}"
          echo "patches not applied: ${failed:-unknown}"
          if [ "${failed:-1}" != "0" ]; then
            echo "::error::integration is missing $failed patch(es); see the conflict issues"
            exit 1
          fi
          nix_result="${{ needs.nix.result }}"
          echo "nix gate: ${nix_result:-unknown}"
          if [ "${nix_result}" = "failure" ]; then
            echo "::error::the nix gate failed on this integration"
            exit 1
          fi
